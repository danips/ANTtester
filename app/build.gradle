plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quantrity.anttester'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.quantrity.anttester"
        minSdk = 7
        targetSdk = 37
        versionCode 202
        versionName "2.02"
        //testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def antLibFile = file('libs/android_antlib_4-16-0.aar')
def antLibChecksums = file('libs/SHA256SUMS')
def verifyAntLibChecksum = tasks.register('verifyAntLibChecksum') {
    inputs.files(antLibFile, antLibChecksums)
    doLast {
        def expected = antLibChecksums.text.trim().split(/\s+/)[0]
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        antLibFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (actual != expected) {
            throw new GradleException("ANTLib checksum mismatch: expected ${expected}, got ${actual}")
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn verifyAntLibChecksum
}

dependencies {
    implementation files(antLibFile)
    testImplementation 'junit:junit:4.13.2'
    //androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    //androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
