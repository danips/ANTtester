plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.quantrity.anttester'
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.quantrity.anttester"
        minSdk = 7
        targetSdk = 36
        versionCode 201
        versionName "2.01"
        //testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def antLibFile = file('libs/android_antlib_4-16-0.aar')
tasks.register('verifyAntLibChecksum') {
    doLast {
        def expected = '944fab1871b18f2b191228af720aaa2eb7057312ffa18d7150f96d1859562d17'
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        antLibFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (actual != expected) {
            throw new GradleException("ANTLib checksum mismatch: expected ${expected}, got ${actual}")
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') task.dependsOn('verifyAntLibChecksum')
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    testImplementation 'junit:junit:4.13.2'
    //androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    //androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
